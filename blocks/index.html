  <body>
    <div class="app">
      <header class="safe-top">
        <div class="row">
          <p class="kicker" id="who">BLOCKS</p>
          <p id="lives" class="kicker">● ● ●</p>
          <p class="kicker">BEST <span id="best">0</span></p>
        </div>
        <div class="row score-row">
          <p id="score" class="score">0</p>
          <span id="combo" class="combo" hidden>Combo ×1</span>
        </div>
      </header>
      <div class="stage">
        <canvas aria-label="Block board. Drag a piece from the tray onto the grid. Pieces cannot rotate."></canvas>
      </div>
      <footer class="safe-bottom">
        <p id="hint" class="hint">Drag a piece onto the grid</p>
        <div class="actions">
          <button id="reset" type="button">New game</button>
          <button id="mute" type="button" aria-pressed="false">Sound on</button>
        </div>
      </footer>
      <p id="live" class="sr-only" aria-live="polite"></p>
      <div id="stuck" class="over" hidden>
        <div class="card">
          <p class="kicker">NO MOVES</p>
          <p class="hint">A heart clears a patch of blocks, not the whole board.</p>
          <p id="stuck-score" class="score">0</p>
          <button id="life" type="button" class="primary">Use a life</button>
        </div>
      </div>
      <div id="over" class="over" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="over-title">
          <p id="over-title" class="kicker">NO MOVES LEFT</p>
          <p id="over-score" class="score big">0</p>
          <p id="over-best" class="hint">Best 0</p>
          <p id="player" class="hint">Log in on IRWFLIX PLAY first</p>
          <p id="save-status" class="status"></p>
          <ol id="board" class="scores"></ol>
          <button id="again" type="button" class="ghost">Play again</button>
        </div>
      </div>
    </div>

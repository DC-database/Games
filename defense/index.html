<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>IRWFLIX Defense 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="brand">IRWFLIX <span>DEFENSE 3D</span><small>v3.0</small></div>
  <div class="stats">
    <div><label>WAVE</label><b id="wave">1</b></div>
    <div><label>HP</label><b id="hp">20</b></div>
    <div><label>GOLD</label><b id="gold">600</b></div>
    <div><label>SCORE</label><b id="score">0</b></div>
  </div>
  <div class="rush" id="rush" hidden><b>⚡ BATTLE RUSH <span id="rushMult">×2</span></b><span id="rushTime">60</span>s</div>
</div>
<div id="bossbar" hidden><div><b id="bossName">BOSS</b><span id="bossHpText"></span></div><div class="bar"><i id="bossHp"></i></div></div>
<div id="message" class="message"></div>
<div id="towerPanel" class="panel hidden">
  <div class="panelTitle"><b id="towerTitle">Tower</b><button id="closeTower">×</button></div>
  <div class="towerStats" id="towerStats"></div>
  <button id="upgradeBtn" class="primary">UPGRADE</button>
  <button id="sellBtn" class="secondary">SELL</button>
</div>
<div id="heroPanel" class="panel hidden">
  <div class="panelTitle"><b>HERO</b><button id="closeHero">×</button></div>
  <div id="heroStats"></div>
  <button id="heroUpgradeBtn" class="primary">UPGRADE HERO</button>
</div>
<div id="palette">
  <div class="paletteTitle">BUILD TOWERS</div>
  <div class="towerCard" data-type="turret"><b>Turret</b><span>💰 120</span></div>
  <div class="towerCard" data-type="cannon"><b>Cannon</b><span>💰 180</span></div>
  <div class="towerCard" data-type="ballista"><b>Ballista</b><span>💰 220</span></div>
  <div class="towerCard" data-type="catapult"><b>Catapult</b><span>💰 260</span></div>
  <div class="hint">Press & hold a tower, then drag it onto a glowing build pad.</div>
</div>
<div id="bottomBar">
  <button id="heroBtn">🦸 HERO</button>
  <button id="pauseBtn">Ⅱ PAUSE</button>
  <button id="endBtn">END RUN</button>
</div>
<div id="modal" class="modal hidden"><div class="modalBox"><h2 id="modalTitle">GAME OVER</h2><div id="modalBody"></div><div class="modalActions"><button id="submitBtn" class="primary">SUBMIT SCORE</button><button id="restartBtn" class="secondary">NEW RUN</button></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IRWFLIX PLAY — Memory Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">IRWFLIX <span>PLAY</span></div>
    <div class="header-actions"><button class="sound-toggle" id="soundToggle" aria-label="Mute sounds">🔊</button><div class="version">MEMORY v16</div></div>
  </header>

  <div class="stats">
    <div class="stat"><small>LEVEL</small><b id="level">1</b><div class="progress"><i id="levelFill"></i></div></div>
    <div class="stat"><small>MOVES</small><b id="moves">0</b></div>
    <div class="stat"><small>TIME</small><b id="time">0:00</b></div>
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
  </div>

  <section class="game">
    <div class="top">
      <div><h1>🧠 Memory Match</h1><p>Find the matching animal pairs.</p></div>
      
    </div>
    <div id="message" class="message">Tap any card to begin. +3 seconds for a match · −1 second for a miss.</div>
    <div id="board" class="board" aria-label="Memory cards"></div>
    <div class="controls">
      <button class="new" id="newGame">NEW GAME</button>
      <button class="end" id="endRun">SUBMIT RUN</button>
    </div>
  </section>

  <section class="leader">
    <div class="leader-head"><h2>🏆 GLOBAL LEADERBOARD</h2><button id="refresh">↻</button></div>
    <ol id="leaderboard"><li>Loading…</li></ol>
  </section>
</div>

<div id="overlay" class="overlay hidden"></div>
<script src="memory-v16.js"></script>
</body>
</html>
